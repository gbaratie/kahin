<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Quorum — proposition design unifié</title>
    <style>
      :root {
        --primary: #0f766e;
        --ink: #0f172a;
        --muted: #475569;
        --bg: #f1f5f9;
        --surface: #ffffff;
        --border: #e2e8f0;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: 'Segoe UI', 'Helvetica Neue', sans-serif;
        color: var(--ink);
        background: var(--bg);
        line-height: 1.5;
      }
      header {
        background: var(--surface);
        border-bottom: 1px solid var(--border);
        padding: 1.75rem 1.5rem;
      }
      .wrap {
        max-width: 1100px;
        margin: 0 auto;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 0.6rem;
        font-weight: 700;
        font-size: 1.15rem;
        margin-bottom: 0.75rem;
      }
      .mark {
        width: 28px;
        height: 28px;
        border-radius: 999px;
        background: var(--primary);
        color: #fff;
        display: grid;
        place-items: center;
        font-size: 0.9rem;
        font-weight: 700;
      }
      h1 {
        margin: 0 0 0.4rem;
        font-size: clamp(1.5rem, 3vw, 2rem);
      }
      header p {
        margin: 0;
        color: var(--muted);
        max-width: 40rem;
      }
      header a {
        color: var(--primary);
      }
      .grid {
        display: grid;
        gap: 1.25rem;
        padding: 1.5rem;
      }
      @media (min-width: 860px) {
        .grid {
          grid-template-columns: 1fr 1fr;
        }
        .span-2 {
          grid-column: 1 / -1;
        }
      }
      figure {
        margin: 0;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 12px;
        overflow: hidden;
      }
      figure img {
        display: block;
        width: 100%;
        height: auto;
        background: #0f172a;
      }
      figcaption {
        padding: 1rem 1.1rem 1.15rem;
      }
      .badge {
        display: inline-block;
        font-size: 0.7rem;
        font-weight: 700;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: var(--primary);
        background: #ccfbf1;
        padding: 0.2rem 0.5rem;
        border-radius: 6px;
        margin-bottom: 0.45rem;
      }
      figcaption strong {
        display: block;
        margin-bottom: 0.2rem;
      }
      figcaption span {
        color: var(--muted);
        font-size: 0.92rem;
      }
      footer {
        max-width: 1100px;
        margin: 0 auto;
        padding: 0 1.5rem 2.5rem;
        color: var(--muted);
        font-size: 0.9rem;
      }
    </style>
  </head>
  <body>
    <header>
      <div class="wrap">
        <div class="brand"><span class="mark">Q</span> Quorum</div>
        <h1>Proposition design unifié</h1>
        <p>
          Un seul système (teal + slate, MUI) pour mobile, admin et projection.
          Nom hypothétique : Quorum — voir
          <a href="./proposition-design-unifie.md">proposition-design-unifie.md</a>.
        </p>
      </div>
    </header>
    <main class="wrap grid">
      <figure>
        <img src="./rendus/quorum-join.png" alt="Join session mobile" />
        <figcaption>
          <span class="badge">Mobile</span>
          <strong>Join session</strong>
          <span>Même AppBar, surfaces et CTA primary teal.</span>
        </figcaption>
      </figure>
      <figure>
        <img
          src="./rendus/quorum-participant-answer.png"
          alt="Participant answer mobile"
        />
        <figcaption>
          <span class="badge">Mobile</span>
          <strong>Answer</strong>
          <span>AnswerOption A–D + TimerBar (accent corail réservé au temps).</span>
        </figcaption>
      </figure>
      <figure class="span-2">
        <img
          src="./rendus/quorum-presenter-lobby.png"
          alt="Presenter lobby"
        />
        <figcaption>
          <span class="badge">Presenter</span>
          <strong>Lobby</strong>
          <span>Mêmes tokens en densité present (fond slate, accent teal).</span>
        </figcaption>
      </figure>
      <figure class="span-2">
        <img
          src="./rendus/quorum-presenter-question.png"
          alt="Presenter question"
        />
        <figcaption>
          <span class="badge">Presenter</span>
          <strong>Live question</strong>
          <span>Grille 2×2 = mêmes AnswerOption, échelle plus grande.</span>
        </figcaption>
      </figure>
      <figure class="span-2">
        <img src="./rendus/quorum-admin.png" alt="Admin quizzes" />
        <figcaption>
          <span class="badge">Admin</span>
          <strong>Quizzes</strong>
          <span>Sidebar + Launch primary — même langage que le reste du produit.</span>
        </figcaption>
      </figure>
    </main>
    <footer>
      Hypothèse de marque « Quorum » pour les maquettes — remplaçable sans
      changer le design system.
    </footer>
  </body>
</html>
