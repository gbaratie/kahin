<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kahin — Galerie de rendus UX</title>
    <style>
      :root {
        --bg: #0b3d3a;
        --bg-2: #145c56;
        --ink: #f4efe6;
        --muted: #c5d5d2;
        --accent: #f0a04b;
        --panel: rgba(255, 255, 255, 0.06);
        --border: rgba(244, 239, 230, 0.12);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: 'Segoe UI', 'Helvetica Neue', sans-serif;
        color: var(--ink);
        background:
          radial-gradient(
            1200px 600px at 10% -10%,
            #1a6b63 0%,
            transparent 55%
          ),
          linear-gradient(160deg, var(--bg), #071f1e 70%);
        min-height: 100vh;
        line-height: 1.5;
      }
      header {
        padding: 2.5rem 1.5rem 1rem;
        max-width: 1100px;
        margin: 0 auto;
      }
      h1 {
        font-size: clamp(1.8rem, 4vw, 2.6rem);
        margin: 0 0 0.4rem;
        letter-spacing: -0.02em;
      }
      header p {
        margin: 0;
        color: var(--muted);
        max-width: 42rem;
      }
      header a {
        color: var(--accent);
      }
      .grid {
        display: grid;
        gap: 1.5rem;
        padding: 1.5rem;
        max-width: 1100px;
        margin: 0 auto 3rem;
      }
      @media (min-width: 800px) {
        .grid {
          grid-template-columns: 1fr 1fr;
        }
        .span-2 {
          grid-column: 1 / -1;
        }
      }
      figure {
        margin: 0;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 14px;
        overflow: hidden;
        backdrop-filter: blur(6px);
      }
      figure img {
        display: block;
        width: 100%;
        height: auto;
        background: #000;
      }
      figcaption {
        padding: 1rem 1.1rem 1.2rem;
      }
      figcaption strong {
        display: block;
        font-size: 1.05rem;
        margin-bottom: 0.25rem;
      }
      figcaption span {
        color: var(--muted);
        font-size: 0.92rem;
      }
      .badge {
        display: inline-block;
        margin-bottom: 0.5rem;
        font-size: 0.75rem;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: var(--bg);
        background: var(--accent);
        padding: 0.2rem 0.55rem;
        border-radius: 6px;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Kahin — rendus UX</h1>
      <p>
        Propositions de direction visuelle pour mobile, desktop et projection.
        Voir l’étude complète :
        <a href="./etude-interfaces-ux.md">etude-interfaces-ux.md</a>
      </p>
    </header>
    <main class="grid">
      <figure>
        <img
          src="./rendus/kahin-join-mobile.png"
          alt="Écran mobile rejoindre la session"
        />
        <figcaption>
          <span class="badge">Mobile</span>
          <strong>Rejoindre</strong>
          <span>Marque hero, saisie code, un seul CTA.</span>
        </figcaption>
      </figure>
      <figure>
        <img
          src="./rendus/kahin-participant-answer-mobile.png"
          alt="Écran mobile réponse à une question"
        />
        <figcaption>
          <span class="badge">Mobile</span>
          <strong>Répondre</strong>
          <span>Choix A–D tactiles, timer visible, mode discret.</span>
        </figcaption>
      </figure>
      <figure class="span-2">
        <img
          src="./rendus/kahin-host-lobby-projection.png"
          alt="Lobby hôte pour vidéoprojecteur"
        />
        <figcaption>
          <span class="badge">Projection</span>
          <strong>Lobby hôte</strong>
          <span>Code XXL, QR dominant, compteur de participants.</span>
        </figcaption>
      </figure>
      <figure class="span-2">
        <img
          src="./rendus/kahin-host-question-projection.png"
          alt="Question live projetée"
        />
        <figcaption>
          <span class="badge">Projection</span>
          <strong>Question live</strong>
          <span>Grille 2×2 lisible à distance, timer et compteur.</span>
        </figcaption>
      </figure>
      <figure>
        <img
          src="./rendus/kahin-participant-ranking-mobile.png"
          alt="Classement personnel mobile"
        />
        <figcaption>
          <span class="badge">Mobile</span>
          <strong>Classement perso</strong>
          <span>Rang hero + top liste, attente de la suite.</span>
        </figcaption>
      </figure>
      <figure>
        <img
          src="./rendus/kahin-admin-desktop.png"
          alt="Tableau de bord animateur desktop"
        />
        <figcaption>
          <span class="badge">Desktop</span>
          <strong>Admin animateur</strong>
          <span>Sidebar structurée, lancement rapide des QCM.</span>
        </figcaption>
      </figure>
    </main>
  </body>
</html>
